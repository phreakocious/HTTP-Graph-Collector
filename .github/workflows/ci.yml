name: CI

on:
  push:
    branches: [main, manifest_v3]
  pull_request:
    branches: [main, manifest_v3]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install networkx tldextract tqdm
      - run: python -m unittest discover -s test -p "test_*.py"
